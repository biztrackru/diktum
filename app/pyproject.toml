[project]
name = "voice-recognizer"
version = "0.2.0a2"
description = "Diktum: local Russian transcription and speaker diarization pipeline for long voice recordings."
requires-python = ">=3.12,<3.13"
# Release installs use requirements-macos-arm64-py312.lock (including hashes).
dependencies = [
    "typer>=0.27.3,<0.28",
    "rich>=15,<16",
]

[project.optional-dependencies]
installer = [
    "pip==26.2.1",
    "setuptools==84.0.0",
    "wheel>=0.46,<1",
]
ctc = [
    "numpy>=2.5.4,<2.6",
    "onnxruntime>=1.31,<1.32",
]
asr = [
    # Optional upstream research package; the product uses ONNX/Rust backends.
    "gigaam @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
]
diarization = [
    "numpy>=2.5.4,<2.6",
    "pyannote.audio==4.0.7",
    "torch>=2.14.1,<2.15",
    "torchcodec>=0.17,<0.18",
    "lightning>=2.6.6,<3",
    "pytorch-lightning>=2.6.6,<3",
    "huggingface-hub>=2.2,<3",
]
docs = [
    "python-docx>=1.1,<2.0",
]

[project.scripts]
dictum = "voice_recognizer.cli:app"
voice-recognizer = "voice_recognizer.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
